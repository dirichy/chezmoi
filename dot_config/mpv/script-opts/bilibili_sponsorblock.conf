# ~/.config/mpv/script-opts/bilibili_sponsorblock.conf

# 只跳过植入广告。想更激进可改为：sponsor,selfpromo,interaction
categories=sponsor

# 保持 skip；不要跳 poi/chapter 等非跳过动作
action_types=skip

# 只在明确来自 Bilibili 的 URL/metadata 上启用，避免本地文件名或标题里有 BV 时误触发
require_bilibili_source=yes

# B 站网络流上 exact seek 偶发卡顿，默认用关键帧跳转
seek_mode=keyframes

# 显示 OSD 提示
osd=yes

# 记录跳过次数到 API。默认不写入服务器。
record_views=no

# API 正式环境
api_base=https://bsbsb.top/api
