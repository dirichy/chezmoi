# ~/.config/mpv/script-opts/image_mode.conf

# 图片模式按 e 调用的外部编辑器。
# 当前默认交给系统关联程序；安装 satty/swappy/gimp/krita/pinta 后可改成对应命令。
editor_cmd=xdg-open

# 图片模式按 v 进入裁剪；拖动选择区域后按 Enter 保存为非覆盖副本。
crop_cmd=magick
crop_suffix=-crop
crop_min_pixels=4
crop_preview_fps=30

# 图片模式按 D 或 Delete 删除当前图片；默认放进回收站。
delete_cmd=gio
delete_arg=trash
