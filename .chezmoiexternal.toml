# macOS desktop automation.
{{ if and (eq .chezmoi.os "darwin") .apps.hammerspoon.enabled }}
{{ template "hammerspoon_installspoon" "Caffeine" }}
{{ template "hammerspoon_installspoon" "EmmyLua" }}
{{ end }}

# FDU VPN helper.
{{ if and (eq .chezmoi.os "darwin") .features.fduConnect }}
[".local/bin/fdu-connect"]
type = "archive-file"
url = "https://ghfast.top/https://github.com/AkiraSalvare/fdu-connect/releases/download/0.1.0/fdu-connect-darwin-arm64.zip"
path = "fdu-connect"
executable = true
{{ end }}

# Personal password store.
{{ if eq .name "dirichy" }}
[".local/share/gopass/stores/root/"]
type = "git-repo"
url = "https://ghfast.top/https://github.com/dirichy/gopass.git"
{{ end }}

# Rime large dictionaries.
{{ if .apps.fcitx5.enabled }}
[".local/share/fcitx5/rime"]
type = "archive"
url = "https://ghfast.top/https://github.com/evawyy/rime_bigfiles/releases/download/0.0.1/rime_big.tar.gz"
stripComponents = 1
{{ end }}

