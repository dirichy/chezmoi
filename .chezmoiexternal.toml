# Zsh plugins: keep checkouts beside the configuration so the directory is portable.
# Zsh is managed for every profile; only the preferred downloader changes.
{{ if eq (includeTemplate "preferChezmoiDownloads" .) "true" }}
{{ range $repo := splitList "\n" (trim (includeTemplate "zsh-plugin-repos" .)) }}
[".config/zsh/plugins/{{ base $repo }}"]
type = "git-repo"
url = "https://github.com/{{ $repo }}.git"
refreshPeriod = "168h"
clone.args = ["--depth=1", "--single-branch"]
pull.args = ["--ff-only"]
{{ end }}
{{ end }}

# Mihomo Geo data. In native mode Mihomo downloads and refreshes these itself.
{{ if and .apps.mihomo.enabled (eq (includeTemplate "preferChezmoiDownloads" .) "true") }}
{{ range $name := list "GeoIP.dat" "GeoSite.dat" "Country.mmdb" }}
{{ $url := printf "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/%s" (lower $name) }}
[".config/mihomo/{{ $name }}"]
type = "file"
refreshPeriod = "24h"
urls = {{ includeTemplate "githubDownloadURLs" (dict "config" $ "url" $url) }}
{{ end }}
{{ end }}

# macOS desktop automation.
{{ if and (eq .chezmoi.os "darwin") .apps.hammerspoon.enabled }}
{{ range $name := list "Caffeine" "EmmyLua" }}
{{ $url := printf "https://raw.githubusercontent.com/Hammerspoon/Spoons/master/Spoons/%s.spoon.zip" $name }}
[".hammerspoon/Spoons/{{ $name }}.spoon"]
type = "archive"
stripComponents = 1
refreshPeriod = "24h"
urls = {{ includeTemplate "githubDownloadURLs" (dict "config" $ "url" $url) }}
{{ end }}
{{ end }}

# FDU VPN helper.
{{ if and (eq .chezmoi.os "darwin") .features.fduConnect }}
[".local/bin/fdu-connect"]
type = "archive-file"
url = {{ includeTemplate "githubDownloadURL" (dict "config" . "url" "https://github.com/AkiraSalvare/fdu-connect/releases/download/0.1.0/fdu-connect-darwin-arm64.zip") | quote }}
urls = {{ includeTemplate "githubDownloadURLs" (dict "config" . "url" "https://github.com/AkiraSalvare/fdu-connect/releases/download/0.1.0/fdu-connect-darwin-arm64.zip") }}
path = "fdu-connect"
executable = true
{{ end }}

# Update the upstream checkout before rendering .local/share/fcitx5/rime templates.
{{ if .features.inputMethod }}
[".cache/rime-ice/upstream"]
type = "git-repo"
url = "https://github.com/iDvel/rime-ice.git"
refreshPeriod = "24h"
clone.args = ["--depth=1", "--single-branch", "--branch=main"]
pull.args = ["--ff-only"]

[".cache/rime-tiger/upstream"]
type = "git-repo"
url = "https://github.com/zhhmn/huma-rime.git"
refreshPeriod = "24h"
clone.args = ["--depth=1", "--single-branch", "--branch=master"]
pull.args = ["--ff-only"]
{{ end }}

