# macOS desktop automation.
{{ if and (eq .chezmoi.os "darwin") .apps.hammerspoon.enabled }}
{{ template "hammerspoon_installspoon" "Caffeine" }}
{{ template "hammerspoon_installspoon" "EmmyLua" }}
{{ end }}

# FDU VPN helper.
{{ if and (eq .chezmoi.os "darwin") .features.fduConnect }}
[".local/bin/fdu-connect"]
type = "archive-file"
url = "https://ghfast.top/https://github.com/AkiraSalvare/fdu-connect/releases/download/0.1.0/fdu-connect-darwin-arm64.zip"
path = "fdu-connect"
executable = true
{{ end }}

# Personal password store.
{{ if eq .name "dirichy" }}
[".local/share/gopass/stores/root/"]
type = "git-repo"
url = "https://ghfast.top/https://github.com/dirichy/gopass.git"
{{ end }}

# Update the upstream checkout before rendering .local/share/fcitx5/rime templates.
{{ if .features.inputMethod }}
[".cache/rime-ice/upstream"]
type = "git-repo"
url = "https://github.com/iDvel/rime-ice.git"
refreshPeriod = "24h"
clone.args = ["--depth=1", "--single-branch", "--branch=main"]
pull.args = ["--ff-only"]

[".cache/rime-tiger/upstream"]
type = "git-repo"
url = "https://github.com/zhhmn/huma-rime.git"
refreshPeriod = "24h"
clone.args = ["--depth=1", "--single-branch", "--branch=master"]
pull.args = ["--ff-only"]
{{ end }}

